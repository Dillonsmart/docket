name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (a tag that already exists)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

      - name: Build every platform
        id: build
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/build-release.sh "$VERSION" dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ### Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/Dillonsmart/docket/main/install.sh | sh
          ```

          Or download the archive for your platform below, unpack it and put `docket` on your PATH.
          No Go toolchain needed. Verify a download against `SHA256SUMS`.

          Then, in a repository:

          ```sh
          docket init
          ```
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "docket $VERSION" --notes "$NOTES"
          fi
